    <meta charset="UTF-8" />
    <script>
      /* Ensure window.fetch has both getter and setter in iframe environments */
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          var originalFetch = target.fetch ? target.fetch.bind(target) : null;
          var customFetch = originalFetch;
          Object.defineProperty(target, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if non-configurable
        }
      })();
    </script>
